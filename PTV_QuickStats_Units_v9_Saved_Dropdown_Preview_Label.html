<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTV Quick Stats - Offense / Defense / Special Teams</title>
<script id="googleGsiScript" src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#101619;--panel:#1a2327;--panel2:#11181b;--line:#304046;--text:#eef3f5;--muted:#92a4ab;--accent:#ef3b3b;--accent-dark:#a9181f;--danger:#ff8d8d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.app{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.logo-wrap{display:flex;justify-content:center;margin:0 0 10px}.logo{width:128px;height:128px;object-fit:contain;display:block}h1{margin:0;text-align:center;font-size:21px;font-weight:750;letter-spacing:.02em}.sub{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 18px}#customPlayerWrap{display:none;margin-top:8px}#customPlayer{font-size:15px;font-weight:650;text-align:left;text-transform:uppercase}
.section{margin:0 0 18px}.section-title{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}.player-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
button{font:inherit;color:var(--text);border:1px solid var(--line);background:#141d21;border-radius:8px;cursor:pointer;font-weight:700;touch-action:manipulation}
button:hover{border-color:var(--accent)}button.active{background:var(--accent-dark);border-color:var(--accent);box-shadow:0 0 0 1px rgba(239,59,59,.22) inset}button:disabled{opacity:.5;cursor:not-allowed}
.mode-btn{min-height:46px;padding:8px 6px;font-size:13px}.player-btn{min-height:62px;padding:8px 4px;font-size:12px;line-height:1.15;text-transform:uppercase}.player-btn .first{display:block;font-size:10px;font-weight:600;color:#c2d0d4;margin-bottom:2px}.player-btn .last{display:block;font-size:12px}
.stat-pair{display:grid;grid-template-columns:1fr 108px;gap:8px;align-items:stretch;margin-bottom:12px}.stat-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat-btn{min-height:48px;padding:7px 5px;font-size:12px;line-height:1.1}
input[type=text]{width:100%;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:18px;font-weight:700;padding:9px 10px;outline:none}input[type=text]:focus{border-color:var(--accent)}.value-input{text-align:center}
.season-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.season-btn{min-height:44px;padding:7px 5px;font-size:12px}#customSeasonWrap{display:none;margin-top:8px}#customSeason{font-size:14px;font-weight:600;text-align:left}
.preview{background:#0c1215;border:1px solid var(--line);border-radius:8px;padding:14px;min-height:78px;font-family:"Eurostile Extended","Eurostyle Extended","Eurostile","Microgramma D Extended",Arial,sans-serif;color:#fff}
.preview-player{font-size:18pt;line-height:1.12;font-weight:400;color:#fff}
.preview-stat{margin-top:5px;font-size:12pt;line-height:1.2;font-weight:400;font-style:italic;color:#fff}
.saved-entry-wrap{margin:16px 0 18px}.saved-entry-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:stretch}.saved-entry-row select{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px;font-weight:650;padding:8px 10px;outline:none}.saved-entry-row select:focus{border-color:var(--accent)}.saved-entry-row select:disabled{opacity:.55}.reload-saved-btn{min-width:76px;padding:7px 10px;font-size:11px}.saved-note{margin-top:6px;color:var(--muted);font-size:10px;line-height:1.35}.manual-area{transition:opacity .15s ease}.manual-area.saved-mode{opacity:.38;pointer-events:none;user-select:none}
.secondary{width:100%;min-height:44px;background:#141d21;color:var(--text);margin-bottom:6px}.publish-btn{width:100%;min-height:54px;background:var(--accent-dark);border-color:var(--accent);font-size:15px;letter-spacing:.03em}.status{margin-top:10px;min-height:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.35}.status.ok{color:var(--accent)}.status.err{color:var(--danger)}.tiny-note{color:var(--muted);font-size:10px;margin-top:-5px}
@media(max-width:560px){body{padding:8px}.app{padding:12px;border-radius:10px}.logo{width:104px;height:104px}.player-grid{grid-template-columns:repeat(3,1fr)}.mode-grid{gap:5px;margin-bottom:14px}.mode-btn{font-size:11px;min-height:42px;padding:6px 4px}.player-grid{gap:4px}.player-btn{min-height:58px;padding:6px 2px}.player-btn .first{font-size:8px}.player-btn .last{font-size:10px}.stat-pair{grid-template-columns:1fr 82px;gap:5px}.stat-buttons{gap:5px}.stat-btn{font-size:10px;padding:6px 3px}.season-grid{gap:5px}.season-btn{font-size:10px;padding:6px 3px}}
</style>
</head>

function splitName(name){const p=name.trim().split(/\s+/);return {first:p.shift()||'',last:p.join(' ')||''};}
function photoPathForPlayer(name){
  const slug=String(name||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return slug?PHOTO_FOLDER+'\\'+slug+'.PNG':'';
}
function clearActive(buttons){buttons.forEach(b=>b.classList.remove('active'));}

function setSavedMode(row){
  selectedSavedRow=row?row.slice(0,8):null;
  manualAreaEl.classList.toggle('saved-mode',!!selectedSavedRow);
  savedEntriesNoteEl.textContent=selectedSavedRow
    ? 'Saved entry selected — Publish will copy it to Sheet1 and rebuild the photo path from the player name.'
    : 'Manual Entry selected — use the buttons below.';
  updatePreview();
}

function normalizeSavedRow(row){
  const out=(row||[]).slice(0,8);
  while(out.length<8) out.push('');
  const normalized=out.map(v=>v==null?'':String(v));
  // Never trust a saved PhotoPath. Rebuild column H from the saved player name.
  normalized[7]=photoPathForPlayer(normalized[0]);
  return normalized;
}

function savedEntryLabel(row){
  // Match exactly what the Preview displays: player name + full rendered stat line.
  // The complete A:H row remains stored behind this option for publishing.
  const player=String((row&&row[0])||'').trim().toUpperCase();
  const fullStatLine=String((row&&row[6])||'').trim();
  if(player && fullStatLine) return player+' — '+fullStatLine;
  if(player) return player;
  if(fullStatLine) return fullStatLine;
  return 'Saved Entry';
}

function setUnit(mode){
  if(!UNITS[mode]) return;
  currentMode=mode;
  const unit=UNITS[mode];
  modeBtns.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  playerSectionTitleEl.textContent=unit.label+' Player';

  playerBtns.forEach((btn,i)=>{
    if(i<unit.players.length){
      const name=unit.players[i];
      const parts=splitName(name);
      btn.dataset.player=name;
      btn.dataset.custom='false';
      btn.querySelector('.first').textContent=parts.first.toUpperCase();
      btn.querySelector('.last').textContent=parts.last.toUpperCase();
      btn.classList.toggle('active',i===0);
    }else{
      btn.dataset.player='';
      btn.dataset.custom='true';
      btn.querySelector('.first').textContent='';
      btn.querySelector('.last').textContent='Custom';
      btn.classList.remove('active');
    }
  });
  customPlayerSelected=false;
  customPlayerEl.value='';
  customPlayerWrapEl.style.display='none';
  selectedPlayer=unit.players[0].toUpperCase();

  [stat1Btns,stat2Btns].forEach(group=>group.forEach((btn,i)=>{
    btn.dataset.value=unit.stats[i];
    btn.textContent=unit.stats[i];
    btn.classList.remove('active');
  }));
  stat1=''; stat2=''; value1El.value=''; value2El.value='';
  updatePreview();
}

modeBtns.forEach(btn=>btn.addEventListener('click',()=>{if(selectedSavedRow){savedEntriesEl.value='';setSavedMode(null);}setUnit(btn.dataset.mode);}));
playerBtns.forEach(btn=>btn.addEventListener('click',()=>{
  if(selectedSavedRow){savedEntriesEl.value='';setSavedMode(null);}
  customPlayerSelected=btn.dataset.custom==='true';
  playerBtns.forEach(b=>b.classList.toggle('active',b===btn));
  if(customPlayerSelected){
    customPlayerWrapEl.style.display='block';
    selectedPlayer=customPlayerEl.value.trim();
    setTimeout(()=>customPlayerEl.focus(),0);
  }else{
    customPlayerWrapEl.style.display='none';
    selectedPlayer=(btn.dataset.player||'').toUpperCase();
  }
  updatePreview();
}));
customPlayerEl.addEventListener('input',()=>{
  const start=customPlayerEl.selectionStart;
  const end=customPlayerEl.selectionEnd;
  customPlayerEl.value=customPlayerEl.value.toUpperCase();
  if(start!==null && end!==null){
    try{customPlayerEl.setSelectionRange(start,end);}catch(e){}
  }
  if(customPlayerSelected) selectedPlayer=customPlayerEl.value.trim();
  updatePreview();
});

function wireStats(buttons,which){
  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    if(selectedSavedRow){savedEntriesEl.value='';setSavedMode(null);}
    const val=btn.dataset.value;
    const current=which===1?stat1:stat2;
    const next=current===val?'':val;
    if(which===1) stat1=next; else stat2=next;
    buttons.forEach(b=>b.classList.toggle('active',b.dataset.value===next));
    updatePreview();
  }));
}
wireStats(stat1Btns,1); wireStats(stat2Btns,2);

seasonBtns.forEach(btn=>btn.addEventListener('click',()=>{
  if(selectedSavedRow){savedEntriesEl.value='';setSavedMode(null);}
  const clicked=btn.dataset.season;
  seasonChoice=seasonChoice===clicked?'':clicked;
  seasonBtns.forEach(b=>b.classList.toggle('active',b.dataset.season===seasonChoice));
  customSeasonWrapEl.style.display=seasonChoice==='__custom__'?'block':'none';
  if(seasonChoice==='__custom__') setTimeout(()=>customSeasonEl.focus(),0);
  updatePreview();
}));
[value1El,value2El,customSeasonEl].forEach(el=>el.addEventListener('input',updatePreview));

function getSeasonLabel(){return seasonChoice==='__custom__'?customSeasonEl.value.trim():seasonChoice;}
function computeLine(s1,v1,s2,v2,season){
  const parts=[];
  if(s1) parts.push((v1?v1+' ':'')+s1);
  if(s2) parts.push((v2?v2+' ':'')+s2);
  let line=parts.join(', ');
  if(season){
    if(!line) return season;
    if(season==='Last Week') return 'Last Week: '+line;
    if(season==='2025'||season==='2026') return season+' Season: '+line;
    return season+': '+line;
  }
  return line;
}
function buildRow(){
  const v1=value1El.value.trim(),v2=value2El.value.trim(),season=getSeasonLabel();
  const player=(customPlayerSelected?customPlayerEl.value.trim():selectedPlayer).toUpperCase();
  const line=computeLine(stat1,v1,stat2,v2,season);
  const photoPath=photoPathForPlayer(player);
  return [player,stat1,stat1?v1:'',stat2,stat2?v2:'',season,line,photoPath];
}
function updatePreview(){
  const row=selectedSavedRow?normalizeSavedRow(selectedSavedRow):buildRow();
  const playerDisplay=(row[0]||(customPlayerSelected?'ENTER CUSTOM PLAYER NAME':'—')).toUpperCase();
  previewPlayerEl.textContent=playerDisplay;
  previewStatEl.textContent=row[6]||'—';
}

async function loadSavedEntries(){
  if(!accessToken){
    savedEntriesEl.disabled=true;
    reloadSavedBtn.disabled=true;
    return;
  }
  savedEntriesEl.disabled=true;
  reloadSavedBtn.disabled=true;
  savedEntriesEl.innerHTML='<option value="">Loading Sheet2…</option>';
  savedEntriesNoteEl.textContent='Loading saved entries from Sheet2…';
  try{
    const range=SAVED_SHEET_NAME+'!A:H';
    const url='https://sheets.googleapis.com/v4/spreadsheets/'+GOOGLE_SHEET_ID+'/values/'+encodeURIComponent(range)+'?majorDimension=ROWS';
    const res=await fetch(url,{headers:{'Authorization':'Bearer '+accessToken}});
    if(res.status===401){
      accessToken=null;
      signInBtn.textContent='Sign in with Google';
      savedEntriesEl.innerHTML='<option value="">Sign in to load Sheet2</option>';
      savedEntriesNoteEl.textContent='Google session expired. Sign in again to load Saved Entries.';
      statusEl.textContent='Session expired - sign in again.';
      statusEl.className='status err';
      return;
    }
    if(!res.ok){
      const body=await res.text();
      throw new Error('HTTP '+res.status+': '+body);
    }
    const data=await res.json();
    const rows=Array.isArray(data.values)?data.values:[];
    savedEntries=[];
    savedEntriesEl.innerHTML='';
    const manualOpt=document.createElement('option');
    manualOpt.value='';
    manualOpt.textContent='Manual Entry';
    savedEntriesEl.appendChild(manualOpt);

    rows.forEach((rawRow,index)=>{
      // Sheet2 row 1 is always the header row and is never shown as a Saved Entry.
      if(index===0) return;
      if(!rawRow || rawRow.every(v=>String(v||'').trim()==='')) return;
      const row=normalizeSavedRow(rawRow);
      const entry={row:row};
      const entryIndex=savedEntries.push(entry)-1;
      const opt=document.createElement('option');
      opt.value=String(entryIndex);
      opt.textContent=savedEntryLabel(row);
      savedEntriesEl.appendChild(opt);
    });

    savedEntriesEl.disabled=false;
    reloadSavedBtn.disabled=false;
    savedEntriesEl.value='';
    setSavedMode(null);
    savedEntriesNoteEl.textContent=savedEntries.length
      ? savedEntries.length+' saved entr'+(savedEntries.length===1?'y':'ies')+' loaded from Sheet2.'
      : 'No saved rows found on Sheet2.';
  }catch(err){
    savedEntriesEl.innerHTML='<option value="">Manual Entry</option>';
    savedEntriesEl.disabled=false;
    reloadSavedBtn.disabled=false;
    savedEntriesNoteEl.textContent='Could not load Sheet2: '+err.message;
  }
}

savedEntriesEl.addEventListener('change',()=>{
  if(savedEntriesEl.value===''){setSavedMode(null);return;}
  const idx=Number(savedEntriesEl.value);
  const entry=savedEntries[idx];
  if(!entry){setSavedMode(null);return;}
  setSavedMode(entry.row);
});
reloadSavedBtn.addEventListener('click',loadSavedEntries);

function googleReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2);}
function enableGoogleSignIn(){
  signInBtn.disabled=false;
  signInBtn.textContent='Sign in with Google';
  if(!accessToken){statusEl.textContent='Google loaded. Ready to sign in.';statusEl.className='status';}
}
function waitForGoogle(){
  if(googleReady()){enableGoogleSignIn();return;}
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(googleReady()){clearInterval(timer);enableGoogleSignIn();}
    else if(tries>=40){clearInterval(timer);statusEl.textContent='Google sign-in did not load. Open this page in Chrome or Safari with internet access.';statusEl.className='status err';signInBtn.textContent='Google sign-in unavailable';}
  },250);
}

function ensureTokenClient(){
  if(!googleReady()){statusEl.textContent='Google sign-in is not loaded yet.';statusEl.className='status err';return null;}
  if(!tokenClient){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/spreadsheets',
      callback:(resp)=>{
        if(resp.error){statusEl.textContent='Sign-in failed: '+resp.error;statusEl.className='status err';return;}
        accessToken=resp.access_token;
        statusEl.textContent='Signed in. Loading Saved Entries…';statusEl.className='status ok';
        signInBtn.textContent='Signed in with Google';
        loadSavedEntries().then(()=>{
          if(accessToken){statusEl.textContent='Signed in. Ready to publish.';statusEl.className='status ok';}
        });
      }
    });
  }
  return tokenClient;
}
signInBtn.addEventListener('click',()=>{const tc=ensureTokenClient();if(tc)tc.requestAccessToken({prompt:accessToken?'':'consent'});});

async function publish(){
  if(!accessToken){statusEl.textContent='Sign in with Google first.';statusEl.className='status err';return;}
  const values=selectedSavedRow?normalizeSavedRow(selectedSavedRow):buildRow();
  if(!selectedSavedRow && !values[0]){statusEl.textContent='Enter a custom player name first.';statusEl.className='status err';customPlayerEl.focus();return;}
  const range=SHEET_NAME+'!A2:H2';
  publishBtn.disabled=true;statusEl.textContent='Publishing…';statusEl.className='status';
  try{
    const url='https://sheets.googleapis.com/v4/spreadsheets/'+GOOGLE_SHEET_ID+'/values/'+encodeURIComponent(range)+'?valueInputOption=RAW';
    const res=await fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({values:[values]})});
    if(res.status===401){accessToken=null;signInBtn.textContent='Sign in with Google';statusEl.textContent='Session expired - sign in again.';statusEl.className='status err';return;}
    if(!res.ok){const body=await res.text();statusEl.textContent='Publish failed (HTTP '+res.status+'): '+body;statusEl.className='status err';return;}
    statusEl.textContent=selectedSavedRow?'Saved entry published to Sheet1.':'Published.';statusEl.className='status ok';
  }catch(err){statusEl.textContent='Network error: '+err.message;statusEl.className='status err';}
  finally{publishBtn.disabled=false;}
}
publishBtn.addEventListener('click',publish);

setUnit('offense');
waitForGoogle();
</script>
